version: 2

sources:
  - name: raw
    description: Raw Brazilian E-commerce data loaded from CSV files
    schema: raw
    tables:
      - name: customers
        description: Customer information including location
        
      - name: geolocation
        description: Brazilian zip codes with lat/long coordinates
        
      - name: order_items
        description: Individual items within each order
        
      - name: order_payments
        description: Payment information for orders
        
      - name: order_reviews
        description: Customer reviews and ratings
        
      - name: orders
        description: Order header information with timestamps
        
      - name: products
        description: Product catalog with categories
        
      - name: sellers
        description: Seller information including location
        
      - name: product_category_name
        description: Translation of product categories PT->EN
  
  - name: ml_outputs
    schema: ml_outputs
    tables:
      - name: seller_clusters
        description: "Seller cluster assignments from K-Means segmentation"
      - name: delivery_predictions
        description: "XGBoost delivery time predictions on test set"